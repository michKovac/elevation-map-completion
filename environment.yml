# conda env create -f environment.yml && conda activate elevcomp
# Adjust pytorch-cuda to match your driver; see requirements-lock.txt for the
# exact versions used in the paper.
name: elevcomp
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pytorch>=2.4
  - torchvision>=0.19
  - pytorch-cuda=12.4
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2
  - scikit-learn>=1.5
  - matplotlib>=3.9
  - tqdm>=4.66
  - tensorboard>=2.17
  - pip
  - pip:
      - segmentation-models-pytorch>=0.4
      - timm>=1.0
      - open3d>=0.18
      - opencv-contrib-python>=4.10
      - tartanair>=1.0
      - -e .
