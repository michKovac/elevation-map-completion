# ==============================================================================
# Configuration of the 5-fold leave-one-environment-out training run
# (scripts/train.py). Defaults are the settings used in the paper.
#
# Data and splits are not configured here. Folds are built automatically from
# --data_root (default: $ELEVCOMP_DATA_ROOT or datasets/elevation_dataset) and
# the normalisation statistics are computed from the training files of each fold.
# Training always starts from scratch; an interrupted fold resumes from last.pth.
#
# Creating an experiment freezes this file into <exp_dir>/experiment.json, so
# later edits here do not affect experiments that are already running.
# ==============================================================================

# -- Model ---------------------------------------------------------------------
model           = "unet_pytorch"  # U-Net with a ResNet-34 encoder (~24.4M)
encoder_name    = "resnet34"
encoder_weights = "imagenet"      # "imagenet" | "none" (from-scratch)

# -- Training ------------------------------------------------------------------
epochs       = 200
batch_size   = 64
lr           = 1e-3
weight_decay = 1e-3
grad_clip    = 1.0

# -- Loss ----------------------------------------------------------------------
w_valid = 0.1   # weight on all ground-truth-valid pixels
w_hole  = 1.0   # weight on hole pixels only (not observed by the depth cameras)

uncertainty        = true   # heteroscedastic output (prediction + log_var), beta-NLL
uncertainty_warmup = 100    # epochs of plain L1 before beta-NLL is enabled
                            # NOTE: when lowering `epochs`, leave at least ~150
                            # epochs after the warmup or sigma will not be learned
uncertainty_beta   = 0.5    # beta of the beta-NLL loss (Seitzer et al., ICLR 2022)

# -- Augmentation: geometric ---------------------------------------------------
aug_hflip_p = 0.5    # probability of a horizontal flip (0.0 = off)
aug_vflip_p = 0.5    # probability of a vertical flip
aug_rot90_p = 0.75   # probability of rot90 (0/90/180/270 deg, uniform)

# -- Augmentation: ray-cone (sensor-geometry-aware) ----------------------------
aug_ray_p         = 0.25     # probability of applying the augmentation (0.0 = off)
aug_ray_n_max     = 3        # 1..N cones, drawn uniformly
aug_ray_angle_deg = [5, 25]  # [min, max] cone width in degrees

# -- Data geometry -------------------------------------------------------------
pad_to            = 256      # 251x251 inputs are centred in a 256x256 canvas
fix_mask_rotation = false    # legacy flag for datasets generated before the
                             # mask-orientation fix; leave false

# -- Output and visualisation --------------------------------------------------
save_dir   = "./runs"   # experiments are created as runs/cv_<name>_<timestamp>/
save_every = 50         # write epoch_NNN.pth every N epochs
vis_every  = 25         # write validation images every N epochs
n_vis      = 8          # samples per figure (also for test_samples.png)

# -- System --------------------------------------------------------------------
num_workers = 8
amp         = true      # automatic mixed precision
amp_dtype   = "fp16"    # "fp16" (default, with grad scaler) | "bf16" (no scaler)
